version: 2

sources:
  - name: interim
    description: >
      Validated Parquet copies of the raw sources, written by `python -m src.ingest`
      (pandera-checked; `src_row` = row position in the raw file).
    meta:
      external_location: "{{ env_var('INTERIM_DIR', 'data/interim') }}/{name}.parquet"
    tables:
      - name: cdc_state
        description: CDC/NCHS VSRR provisional overdose deaths, national + state (data.cdc.gov xkb8-kh2a). All columns text, as read.
      - name: cdc_county
        description: CDC/NCHS VSRR provisional county overdose deaths (data.cdc.gov gb4e-yj24). All-drug only.
      - name: svi_county
        description: CDC/ATSDR Social Vulnerability Index 2022, county CSV (svi.cdc.gov).
      - name: nsduh_2021_2024
        description: NSDUH combined 2021-2024 PUF (Stata), the 15 variables the pipeline uses.
      - name: nsduh_2024
        description: NSDUH 2024 single-year PUF, QUESTID2 + UDYR5PNRANY2 (2024 pain-reliever use disorder).
      - name: nsduh_value_labels
        description: Value labels for the NSDUH variables, from the Stata metadata.
      - name: census_pop
        description: Census Population Estimates Vintage 2025 (co-est2025-alldata), July 1 resident population 2020-2025, states and counties.
      - name: wonder_monthly
        description: CDC WONDER Provisional Mortality monthly death counts (manual exports in data/raw/wonder/), one series per file.
      - name: wonder_query_parameters
        description: The 'Query Parameters' block of each WONDER export (what each series filtered).
      - name: wonder_annual
        description: CDC WONDER annual (Group By Year) exports with population and crude / age-adjusted rates; may be empty.
      - name: teds_a
        description: SAMHSA TEDS-A combined 2006-2023 PUF (admissions 2015-2023) + 2024 single-year PUF (identical codes), 19 variables + source_file (read from the zips by src/ingest.py).
      - name: census_state_age
        description: Census state population by single year of age x race (both sexes, all origins); intercensal 2010-2019, Vintage 2025 2020-2025.
