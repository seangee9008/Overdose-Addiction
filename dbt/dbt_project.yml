# dbt project: Parquet (data/interim/) -> staging views -> mart tables in DuckDB.
# Run from the repo root:  dbt build --project-dir dbt --profiles-dir dbt
name: overdose
version: "1.0.0"
profile: overdose
model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  overdose:
    staging:
      +materialized: view
    marts:
      +materialized: table

flags:
  send_anonymous_usage_stats: false
